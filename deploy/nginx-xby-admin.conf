# 访问永远走 HTTPS：https://47.99.95.38/
# 80 只保留证书续期校验，其余请求 301 到 HTTPS。
# 证书由 acme.sh 签发（Let's Encrypt IP 短证书，约 6 天），续期后写到下面两个文件。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.99.95.38 _;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name 47.99.95.38 _;

    ssl_certificate     /etc/nginx/ssl/ip_cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ip_cert/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    client_max_body_size 20m;
    root /opt/xby-admin/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # AI 成文（含 SSE）：关缓冲 + 长超时
    location ^~ /api/geo/content-placement/articles/ai-generate {
        proxy_pass http://127.0.0.1:8080/api/geo/content-placement/articles/ai-generate;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        gzip off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
        add_header X-Accel-Buffering no always;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
        try_files $uri $uri/ /index.html;
    }
}
