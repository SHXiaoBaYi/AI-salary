# 与 local 相同：本机经 SSH 隧道连 47.99.95.38 上的 MySQL
# 先运行：.\deploy\tunnel-test-rds.ps1
server:
  port: 8099

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13307/base_admin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${xby.rds.username}
    password: ${xby.rds.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

xby:
  rds:
    external-host: 127.0.0.1
    internal-host: 127.0.0.1
  auth:
    password-login-enabled: true
