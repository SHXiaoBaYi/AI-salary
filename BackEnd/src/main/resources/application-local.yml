# 本机开发：经 SSH 隧道连 ECS 47.99.95.38 上的 MySQL。
#
#   .\deploy\tunnel-test-rds.ps1
# 隧道：本机 13307 → 47.99.95.38 的 127.0.0.1:3306
#
# 日常只改前端时：不必起本机后端；前端在 8088，接口代理到本机 8099。
server:
  port: 8099

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13307/base_admin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${xby.rds.username}
    password: ${xby.rds.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

xby:
  # 本机经隧道连 47.99.95.38 上的 MySQL
  rds:
    external-host: 127.0.0.1
    internal-host: 127.0.0.1
  # 勿写死 Windows 盘符：在 macOS/Linux 会被当成相对路径，配图落到 BackEnd/D:/... 且公网打不开
  upload-dir: ${UPLOAD_DIR:./uploads}
  upload-public-base: ${UPLOAD_PUBLIC_BASE:http://47.99.95.38/shxby/api}
  auth:
    password-login-enabled: true
